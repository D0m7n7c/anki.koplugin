name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Installing luarocks from apt pulls in Lua 5.1 (matching KOReader's LuaJIT
      # semantics) and points /usr/bin/lua at it. Same approach as the sibling
      # KOReader plugins — no source build, no flaky lua.org download.
      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck
          sudo luarocks install busted

      # Lint every Lua file (advisory: warnings don't fail the build).
      - name: Lint (luacheck)
        continue-on-error: true
        run: luacheck .

      # Parse every Lua file on Lua 5.1 so a syntax error always fails CI.
      - name: Syntax check
        run: |
          for f in $(find . -name '*.lua'); do
            lua -e "assert(loadfile('$f'))" || exit 1
          done

      # Run the unit tests for the pure-logic modules.
      - name: Run tests (busted)
        run: busted --verbose
